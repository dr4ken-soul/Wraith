name: Wraith keeper cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: wraith-keeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out Wraith
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - name: Install keeper dependencies
        run: npm ci --prefix keeper

      - name: Build keeper
        run: npm --prefix keeper run build

      - name: Run one keeper cycle
        run: npm --prefix keeper run start
        env:
          KEEPER_ONCE: 'true'
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          KEEPER_RPC_URL: ${{ secrets.KEEPER_RPC_URL }}
          KEEPER_VAULT_ADDRESS: ${{ secrets.KEEPER_VAULT_ADDRESS }}
          KEEPER_POOL_ADDRESS: ${{ secrets.KEEPER_POOL_ADDRESS }}
          KEEPER_POLL_INTERVAL_MS: '15000'
